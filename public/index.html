<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Bureau — BD Intelligence</title>
<style>
  :root {
    --bg: #0f172a; --panel: #16203a; --panel-2: #1c2746; --line: #273458;
    --text: #e8ecf7; --muted: #94a3c4; --dim: #64748b;
    --accent: #6366f1; --accent-soft: rgba(99,102,241,.14);
    --ok: #34d399; --warn: #fbbf24; --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #a5b4fc; text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    border-bottom: 1px solid var(--line); padding: 20px 28px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: linear-gradient(180deg, #16203a, #0f172a);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: 19px; letter-spacing: -.2px; }
  .brand span { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12.5px; font-family: var(--mono); text-align: right; line-height: 1.5; }

  button {
    font: 600 14px/1 inherit; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 11px 18px; cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }

  main { display: grid; grid-template-columns: 310px 1fr; gap: 24px; padding: 24px 28px 64px; max-width: 1480px; }
  @media (max-width: 940px) { main { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  /* Agent status panel */
  .agent { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(39,52,88,.5); font-size: 13.5px; }
  .agent:last-child { border-bottom: 0; }
  .agent .n { font-family: var(--mono); color: var(--dim); font-size: 11px; width: 16px; flex: none; }
  .agent .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .t { font-family: var(--mono); font-size: 11px; color: var(--dim); flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.success { background: var(--ok); }
  .dot.error { background: var(--err); }
  .dot.running { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
  .tier { font-family: var(--mono); font-size: 9.5px; padding: 2px 5px; border-radius: 4px; background: var(--accent-soft); color: #a5b4fc; flex: none; }

  /* Signal bar chart */
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 76px 1fr 28px; align-items: center; gap: 10px; font-size: 12.5px; }
  .bar-row .lbl { color: var(--muted); }
  .bar-track { display: block; height: 7px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
  /* display:block — an inline span ignores width percentages and fixed height. */
  .bar-fill { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
  .bar-row .val { font-family: var(--mono); color: var(--text); text-align: right; }

  /* History */
  .hist { display: flex; flex-direction: column; gap: 2px; }
  .hist button {
    background: transparent; border: 0; border-radius: 7px; padding: 9px 10px;
    text-align: left; color: var(--muted); font-weight: 500; font-size: 13.5px;
    display: flex; justify-content: space-between; gap: 8px; width: 100%;
  }
  .hist button:hover { background: var(--panel-2); color: var(--text); }
  .hist button[aria-current="true"] { background: var(--accent-soft); color: #c7d2fe; font-weight: 600; }
  .hist .c { font-family: var(--mono); font-size: 11px; color: var(--dim); flex: none; }

  /* Briefing */
  .briefing { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px 38px; }
  .briefing h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.4px; }
  .briefing h2 {
    font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: #a5b4fc;
    margin: 32px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line); font-weight: 700;
  }
  .briefing h1 + h2 { margin-top: 26px; }
  .briefing ul, .briefing ol { padding-left: 22px; margin: 0; }
  .briefing li { margin: 9px 0; }
  .briefing p { margin: 10px 0; }
  .briefing code { font-family: var(--mono); font-size: .88em; background: var(--panel-2); padding: 2px 5px; border-radius: 4px; }
  .briefing em { color: var(--warn); font-style: normal; }

  .pill { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); color: var(--muted); margin-right: 6px; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }

  /* Configuration selector. Two profiles ship; the switch is the proof that
     one engine serves both, so it is in the header rather than buried. */
  .cfg { display: flex; align-items: center; gap: 8px; }
  .cfg select {
    font-family: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); cursor: pointer;
  }
  .cfg .measures { font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
  .rej { font-size: 12px; border-bottom: 1px solid var(--line); padding: 7px 0; }
  .rej:last-child { border-bottom: 0; }
  .rej .code { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); background: var(--panel-2); padding: 2px 6px; border-radius: 4px; }
  .rej .why { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .counter { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 9px; margin-top: 6px; }
  .log { font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-height: 136px; overflow-y: auto; white-space: pre-wrap; }

  /* Yield funnel + diagnostics */
  .funnel { display: grid; gap: 6px; font-size: 12px; margin-bottom: 14px; }
  .fstep { display: grid; grid-template-columns: 74px 1fr 34px; align-items: center; gap: 8px; }
  .fstep .lbl { color: var(--muted); }
  .fstep .val { font-family: var(--mono); text-align: right; }
  .ftrack { display: block; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .ffill { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 3px; }
  .drop { color: var(--err); }

  .finding { border-left: 2px solid var(--line); padding: 7px 0 7px 10px; margin-bottom: 9px; font-size: 12.5px; }
  .finding.high { border-left-color: var(--err); }
  .finding.medium { border-left-color: var(--warn); }
  .finding.low { border-left-color: var(--dim); }
  .finding .where { font-family: var(--mono); font-size: 10.5px; color: var(--dim); display: block; margin-bottom: 3px; word-break: break-word; }
  .finding .cause { color: var(--text); }
  .finding .fix { color: var(--muted); margin-top: 4px; display: block; font-size: 12px; }
  .allgood { color: var(--ok); font-size: 12.5px; }

  details.qtable { margin-top: 10px; }
  details.qtable summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .qrow { display: grid; grid-template-columns: 1fr 30px 30px; gap: 6px; font-family: var(--mono); font-size: 10.5px; padding: 3px 0; border-bottom: 1px solid rgba(39,52,88,.4); }
  .qrow .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .qrow .n { text-align: right; color: var(--dim); }
  .qrow.zero .q, .qrow.zero .n { color: var(--err); }
  .err { color: var(--err); font-size: 12px; margin-top: 8px; font-family: var(--mono); }

  /* Ask panel */
  .ask-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .ask-row input {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 13px; color: var(--text); font: inherit; font-size: 14px;
  }
  .ask-row input:focus { outline: none; border-color: var(--accent); }
  .ask-row button { padding: 11px 15px; }
  .mic { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); font-size: 16px; }
  .mic.on { background: var(--err); color: #fff; border-color: var(--err); animation: pulse 1.1s ease-in-out infinite; }
  .mic[hidden] { display: none !important; }

  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .examples button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 500;
  }
  .examples button:hover { border-color: var(--accent); color: #c7d2fe; }

  .turn { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin-bottom: 16px; }
  .turn .q { color: var(--muted); font-size: 13px; margin-bottom: 7px; }
  .turn .q::before { content: '❯ '; color: var(--accent); }
  .turn .a { font-size: 14px; line-height: 1.65; }
  .turn .a ol, .turn .a ul { padding-left: 20px; margin: 6px 0; }
  .turn .a li { margin: 5px 0; }
  .turn .a p { margin: 6px 0; }
  .turn .meta { font-family: var(--mono); font-size: 10.5px; color: var(--dim); margin-top: 8px; }
  .turn.thinking .a { color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Signal Bureau</h1>
    <span id="week">—</span>
  </div>
  <div class="cfg">
    <select id="profile" title="Which business this deployment is running for"></select>
    <span class="measures" id="measures"></span>
  </div>
  <div class="spacer"></div>
  <div class="meta" id="meta">loading…</div>
  <button class="ghost" id="refresh">Refresh</button>
  <button id="run">Run pipeline</button>
</header>

<main>
  <aside>
    <div class="card">
      <h2>Agent status</h2>
      <div id="agents"></div>
      <div class="err" id="runError" hidden></div>
    </div>

    <div class="card">
      <h2>Signals by category</h2>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card">
      <h2>Rejected, and why</h2>
      <div id="rejstats" style="font-size:12.5px;color:var(--muted);margin-bottom:10px"></div>
      <div id="rejlist" style="max-height:220px;overflow-y:auto"></div>
    </div>

    <div class="card">
      <h2>Prospect register</h2>
      <div id="regstats" style="font-size:12.5px;color:var(--muted);margin-bottom:10px"></div>
      <div id="reglist" class="hist" style="max-height:260px;overflow-y:auto"></div>
    </div>

    <div class="card">
      <h2>Practice area coverage</h2>
      <div class="bars" id="areas"></div>
      <div id="multi" style="margin-top:12px;font-size:12.5px;color:var(--muted)"></div>
    </div>

    <div class="card">
      <h2>Yield diagnostics</h2>
      <div class="funnel" id="funnel"></div>
      <div id="findings"></div>
      <details class="qtable" id="qtable" hidden>
        <summary>Per-query yield</summary>
        <div id="qrows"></div>
      </details>
    </div>

    <div class="card">
      <h2>Past briefings</h2>
      <div class="hist" id="history"></div>
    </div>

    <div class="card">
      <h2>Run log</h2>
      <div class="log" id="log">Idle.</div>
    </div>
  </aside>

  <section>
    <div class="card" style="margin-bottom:18px">
      <h2>Ask the register</h2>
      <div class="ask-row">
        <input id="q" placeholder="e.g. top 5 multi-service prospects" autocomplete="off">
        <button class="mic" id="mic" title="Ask by voice" hidden>🎤</button>
        <button id="askBtn">Ask</button>
      </div>
      <div class="examples" id="examples"></div>
      <div id="answers"></div>
    </div>

    <div class="briefing" id="briefing">
      <div class="empty">Loading…</div>
    </div>
  </section>
</main>

<script>
// Section names come from the active profile's counts, so the chart follows
// whatever collectors that profile defines.
const LABELS = { account: 'Accounts' };
const label = (k) => LABELS[k] || k.charAt(0).toUpperCase() + k.slice(1);

let briefings = [];
let selected = null;
let poll = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const secs = (ms) => (ms == null ? '' : `${(ms / 1000).toFixed(1)}s`);

function logLine(msg) {
  const el = $('log');
  const stamp = new Date().toTimeString().slice(0, 8);
  el.textContent = `${stamp}  ${msg}\n${el.textContent === 'Idle.' ? '' : el.textContent}`;
}

// ── Minimal markdown renderer. Only the subset the briefing format uses. ─────
function renderMarkdown(md) {
  const lines = String(md).split('\n');
  const out = [];
  let list = null;

  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const inline = (t) => esc(t)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\(unconfirmed\)/gi, '<em>(unconfirmed)</em>')
    // The argument against acting on a lead is set apart, not buried in the
    // sentence that recommends it.
    .replace(/Counter-reading:\s*([^<\n]+)/gi, '<span class="counter">Counter-reading: $1</span>');

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { closeList(); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) {
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(ul[1])}</li>`); continue;
    }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(ol[1])}</li>`); continue;
    }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  return out.join('\n');
}

// ── Rendering ────────────────────────────────────────────────────────────────
function drawAgents(agents, running) {
  $('agents').innerHTML = agents.map((a) => {
    const tier = a.kind === 'nemotron-ultra' ? '<span class="tier">ULTRA</span>' : '';
    const state = running ? 'running' : a.status;
    return `<div class="agent" title="${esc(a.error || a.detail || '')}">
      <span class="n">${a.number}</span>
      <span class="dot ${esc(state)}"></span>
      <span class="nm">${esc(a.name)}</span>
      ${tier}
      <span class="t">${secs(a.duration_ms)}</span>
    </div>`;
  }).join('');
}

function drawBars(counts = {}) {
  const keys = Object.keys(counts);
  if (!keys.length) { $('bars').innerHTML = '<span style="color:var(--dim);font-size:12px">No run yet.</span>'; return; }
  const max = Math.max(1, ...keys.map((k) => counts[k] ?? 0));
  $('bars').innerHTML = keys.map((k) => {
    const n = counts[k] ?? 0;
    return `<div class="bar-row">
      <span class="lbl" title="${esc(label(k))}">${esc(label(k))}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(n / max) * 100}%"></span></span>
      <span class="val">${n}</span>
    </div>`;
  }).join('');
}

const FUNNEL_STEPS = [
  ['searched', 'Searches'], ['hits', 'Hits'], ['fresh', 'New'],
  ['extracted', 'Signals'], ['verified', 'Verified'],
];

function drawDiagnostics(diag) {
  const fEl = $('funnel'), findEl = $('findings'), qEl = $('qtable');
  if (!diag) {
    fEl.innerHTML = '<span style="color:var(--dim);font-size:12px">No run yet.</span>';
    findEl.innerHTML = ''; qEl.hidden = true;
    return;
  }

  // The funnel makes WHERE signals were lost visible at a glance — a collapse
  // between two steps is more informative than the final number alone.
  const f = diag.funnel || {};
  const max = Math.max(1, ...FUNNEL_STEPS.map(([k]) => f[k] ?? 0));
  fEl.innerHTML = FUNNEL_STEPS.map(([k, label], i) => {
    const n = f[k] ?? 0;
    const prev = i ? (f[FUNNEL_STEPS[i - 1][0]] ?? 0) : null;
    const collapsed = prev !== null && prev > 0 && n === 0;
    return `<div class="fstep">
      <span class="lbl">${label}</span>
      <span class="ftrack"><span class="ffill" style="width:${(n / max) * 100}%"></span></span>
      <span class="val ${collapsed ? 'drop' : ''}">${n}</span>
    </div>`;
  }).join('');

  const findings = diag.findings || [];
  findEl.innerHTML = findings.length
    ? findings.map((x) => `<div class="finding ${esc(x.severity)}">
        <span class="where">${esc(x.where)}${x.detail ? ' · ' + esc(x.detail) : ''}</span>
        <span class="cause">${esc(x.cause)}</span>
        ${x.severity === 'low' ? '' : `<span class="fix">${esc(x.fix)}</span>`}
      </div>`).join('')
    : '<div class="allgood">✓ No issues detected</div>';

  const rows = diag.queries || [];
  qEl.hidden = !rows.length;
  $('qrows').innerHTML = rows.map((q) => `<div class="qrow ${q.hits === 0 ? 'zero' : ''}">
    <span class="q" title="${esc(q.query)}">${esc(q.query)}</span>
    <span class="n">${q.hits ?? 0}</span><span class="n">${q.fresh ?? 0}</span>
  </div>`).join('');
}

// Which of the business's offerings this week's signals actually open. A week
// whose signals all point at one product line is a narrower week than the raw
// signal count suggests.
function drawAreas(coverage, multiCount, total) {
  const el = $('areas');
  const keys = Object.keys(coverage || {});
  if (!keys.length) {
    el.innerHTML = '<span style="color:var(--dim);font-size:12px">No practice areas mapped.</span>';
    $('multi').textContent = '';
    return;
  }
  const sorted = keys.sort((a, b) => coverage[b] - coverage[a]);
  const max = Math.max(...sorted.map((k) => coverage[k]));
  el.innerHTML = sorted.map((k) => `<div class="bar-row">
    <span class="lbl" title="${esc(k)}">${esc(label(k))}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${(coverage[k] / max) * 100}%"></span></span>
    <span class="val">${coverage[k]}</span>
  </div>`).join('');
  $('multi').innerHTML = multiCount
    ? `<strong style="color:var(--ok)">${multiCount}</strong> of ${total} signals open <strong>2+ offerings</strong>`
    : `No multi-service openings this week`;
}

function drawHistory() {
  if (!briefings.length) { $('history').innerHTML = '<div class="empty" style="padding:14px 0">No briefings yet.</div>'; return; }
  $('history').innerHTML = briefings.map((b) => `
    <button data-week="${esc(b.week)}" aria-current="${b.week === selected}">
      <span>${esc(b.week_label || b.week)}</span>
      <span class="c">${b.signal_count ?? 0}</span>
    </button>`).join('');

  for (const btn of $('history').querySelectorAll('button')) {
    btn.onclick = () => { selected = btn.dataset.week; drawHistory(); drawBriefing(); };
  }
}

function drawBriefing() {
  const b = briefings.find((x) => x.week === selected);
  const el = $('briefing');
  if (!b) {
    el.innerHTML = `<div class="empty">No briefing yet. Press <strong>Run pipeline</strong> to generate this week's.</div>`;
    drawBars({});
    drawAreas({}, 0, 0);
    return;
  }

  const pills = [
    `${b.signal_count ?? 0} signals`,
    b.critical_count ? `${b.critical_count} Critical` : null,
    b.multi_service_count ? `${b.multi_service_count} multi-service` : null,
    b.account_count ? `${b.account_count} on your accounts` : null,
    b.flagged_count ? `${b.flagged_count} flagged` : null,
    b.trend ? `${b.trend.delta >= 0 ? '+' : ''}${b.trend.delta} vs ${b.trend.previous_week}` : null,
    b.models?.ultra ? `ultra: ${b.models.ultra}` : null,
  ].filter(Boolean);

  el.innerHTML = `<div style="margin-bottom:18px">${pills.map((p) => `<span class="pill">${esc(p)}</span>`).join('')}</div>`
    + renderMarkdown(b.markdown || '');
  drawBars(b.counts);
  drawAreas(b.practice_area_coverage, b.multi_service_count, b.signal_count);
  if (b.diagnostics) drawDiagnostics(b.diagnostics);
}

// ── Data ─────────────────────────────────────────────────────────────────────
// WHICH CONFIGURATION IS BEING VIEWED.
//
// Each profile has its own register, signal log and briefings on the server,
// so every request has to say which one it means. Read from the selector, not
// from module state that could drift out of step with what the user sees.
let profileKey = new URLSearchParams(location.search).get('profile') || '';

// Appends ?profile= to any api path, preserving an existing query string.
const scoped = (path) => !profileKey ? path
  : `${path}${path.includes('?') ? '&' : '?'}profile=${encodeURIComponent(profileKey)}`;

async function get(path) {
  const res = await fetch(scoped(path));
  const data = await res.json().catch(() => ({ ok: false, error: `${res.status} ${res.statusText}` }));
  if (!res.ok || data.ok === false) throw new Error(data.error || `${res.status}`);
  return data;
}

// The prospect list the system has sourced for itself — the thing that grows
// week on week, as opposed to the briefing, which is one week's slice.
async function loadRegister() {
  try {
    const { stats, organisations } = await get('/api/organisations?limit=40');
    $('regstats').innerHTML = `<strong style="color:var(--text);font-size:15px">${stats.total}</strong> organisations sourced`
      + `<br>${stats.prospects} prospects · ${stats.accounts} accounts · ${stats.multi_service} multi-service`
      + (stats.returning ? `<br>${stats.returning} seen in more than one week` : '');
    $('reglist').innerHTML = organisations.map((o) => `
      <button title="${esc(o.practice_areas.join(', '))} · ${o.signal_count} signal(s)" style="cursor:default">
        <span>${esc(o.name)}</span>
        <span class="c">${o.best_score}</span>
      </button>`).join('');
  } catch (err) {
    $('regstats').textContent = 'No register yet.';
  }
}

// Drawn from the server's own list, so adding a third profile needs no change
// here — the dropdown is whatever the loader registers.
function drawProfiles(profiles, active) {
  const sel = $('profile');
  if (!profiles?.length) return;
  if (sel.options.length !== profiles.length) {
    sel.innerHTML = profiles.map((p) => `<option value="${esc(p.key)}">${esc(p.name)}</option>`).join('');
  }
  sel.value = active.key;
  profileKey = active.key;
  // What this configuration MEASURES is the difference worth showing: the same
  // engine scores commercial value by deal scale for one business and by
  // service breadth for the other.
  $('measures').innerHTML = `${active.market ? `${esc(active.market)} · ` : ''}`
    + `value = ${esc(active.value_factor ?? 'Multi-Service Potential')} · ${active.accounts} accounts`;
  drawExamples(active.first_practice_area);
}

// What the pipeline threw away. Shown next to what it kept, deliberately: a
// tool that only displays its hits cannot be audited, and the reason code
// separates a correct suppression from a defect in the rules.
async function loadRejections() {
  try {
    const { total, by_code: byCode, rejections } = await get('/api/rejections?limit=25');
    if (!total) { $('rejstats').textContent = 'Nothing rejected yet.'; $('rejlist').innerHTML = ''; return; }
    $('rejstats').innerHTML = `<strong style="color:var(--text);font-size:15px">${total}</strong> rejected and kept on record`
      + `<br>${Object.entries(byCode).map(([c, n]) => `${n} ${c.toLowerCase().replace(/_/g, ' ')}`).join(' · ')}`;
    $('rejlist').innerHTML = rejections.map((r) => `
      <div class="rej">
        <span class="code">${esc(r.reason_code ?? 'UNKNOWN')}</span>
        <span style="margin-left:7px">${esc(r.company ?? 'unnamed')}</span>
        <div class="why">${esc(r.reason ?? '')}</div>
      </div>`).join('');
  } catch (err) {
    $('rejstats').textContent = 'No rejection log yet.';
  }
}

async function loadStatus() {
  const s = await get('/api/status');
  $('week').textContent = s.current_week;
  drawAgents(s.agents, s.running);
  $('run').disabled = s.running;
  $('run').textContent = s.running ? 'Running…' : 'Run pipeline';

  if (s.profile) drawProfiles(s.profiles, s.profile);
  drawDiagnostics(s.diagnostics);

  const last = s.last_run;
  $('meta').innerHTML = [
    last ? `last run ${new Date(last.started_at).toLocaleString('en-GB')} · ${last.status}${last.dry_run ? ' · dry run' : ''}` : 'never run',
    `${s.totals.briefings} briefings · ${s.totals.signals} signals all-time`,
  ].join('<br>');

  const errEl = $('runError');
  if (last?.error) { errEl.hidden = false; errEl.textContent = last.error; }
  else errEl.hidden = true;

  return s;
}

async function loadBriefings(keepSelection = false) {
  const { briefings: list } = await get('/api/briefings');
  briefings = list;
  if (!keepSelection || !briefings.some((b) => b.week === selected)) selected = briefings[0]?.week ?? null;
  drawHistory();
  drawBriefing();
}

async function refresh(keepSelection = true) {
  try {
    const s = await loadStatus();
    await Promise.all([loadBriefings(keepSelection), loadRegister(), loadRejections()]);
    return s;
  } catch (err) {
    logLine(`error: ${err.message}`);
  }
}

function startPolling() {
  if (poll) return;
  poll = setInterval(async () => {
    const s = await refresh();
    if (s && !s.running) {
      clearInterval(poll); poll = null;
      logLine(`run finished — ${s.last_run?.status ?? 'unknown'}, ${s.last_run?.signal_count ?? 0} signals in ${secs(s.last_run?.duration_ms)}`);
    }
  }, 2000);
}

$('run').onclick = async () => {
  $('run').disabled = true;
  $('run').textContent = 'Starting…';
  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ profile: profileKey || undefined }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'failed to start');
    logLine(`pipeline started${data.dryRun ? ' (dry run)' : ''} — ${data.profile ?? 'default'}, ${data.agents?.length ?? 0} agents`);
    startPolling();
  } catch (err) {
    logLine(`could not start: ${err.message}`);
    $('run').disabled = false;
    $('run').textContent = 'Run pipeline';
  }
};

// Switching configuration is a full reload of every panel, not a filter: the
// two profiles do not share a register, a signal log or a briefing history.
$('profile').onchange = async (e) => {
  profileKey = e.target.value;
  const url = new URL(location.href);
  url.searchParams.set('profile', profileKey);
  history.replaceState(null, '', url);
  selected = null;
  logLine(`configuration → ${profileKey}`);
  await refresh(false);
};

$('refresh').onclick = () => { logLine('refreshed'); refresh(); };

// ── Ask the register ────────────────────────────────────────────────────────
// Retrieval happens on the server, in code. This only sends the question and
// renders what comes back, so nothing here can invent a company.
// Four questions are true of any configuration. The fifth names a practice
// area, so it comes from the active profile — "critical prospects in compute"
// is meaningless to a search firm, which sells retained search and interim
// cover, not GPUs.
const EXAMPLES = [
  'top 5 multi-service prospects',
  'what is closing in the next 14 days?',
  'which accounts have gone quiet?',
  'what was flagged for review?',
];

let asking = false;

function drawExamples(areaKey) {
  const list = areaKey ? [...EXAMPLES.slice(0, 3), `critical prospects in ${areaKey}`, EXAMPLES[3]] : EXAMPLES;
  $('examples').innerHTML = list.map((e) => `<button>${esc(e)}</button>`).join('');
  for (const b of $('examples').querySelectorAll('button')) {
    b.onclick = () => { $('q').value = b.textContent; askQuestion(); };
  }
}
drawExamples();

async function askQuestion() {
  const question = $('q').value.trim();
  if (!question || asking) return;
  asking = true;
  $('askBtn').disabled = true;
  $('q').value = '';

  const turn = document.createElement('div');
  turn.className = 'turn thinking';
  turn.innerHTML = `<div class="q">${esc(question)}</div><div class="a">Searching the register…</div>`;
  $('answers').prepend(turn);

  try {
    const res = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, profile: profileKey || undefined }),
    });
    const data = await res.json();
    if (!res.ok || data.ok === false) throw new Error(data.error || 'failed');

    turn.className = 'turn';
    turn.innerHTML = `<div class="q">${esc(question)}</div>`
      + `<div class="a">${renderMarkdown(data.answer || '')}</div>`
      + `<div class="meta">${esc(data.entity ?? '')} · ${esc((data.applied ?? []).join(' · '))}`
      + ` · ${data.total ?? 0} matched${data.truncated ? `, showing ${data.rows?.length}` : ''}</div>`;
    speak(data.answer);
  } catch (err) {
    turn.className = 'turn';
    turn.innerHTML = `<div class="q">${esc(question)}</div><div class="a" style="color:var(--err)">${esc(err.message)}</div>`;
  } finally {
    asking = false;
    $('askBtn').disabled = false;
  }
}

$('askBtn').onclick = askQuestion;
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });

// ── Voice ───────────────────────────────────────────────────────────────────
// The browser listens and speaks; every piece of reasoning still happens on
// Nebius. Nebius serves no speech model, so this is the only way to do voice
// without adding a third provider — and it keeps the whole AI path on Nebius.
// Typing always works; voice is an alternative, never a requirement.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;

if (SR) {
  $('mic').hidden = false;
  recog = new SR();
  recog.lang = 'en-GB';
  recog.interimResults = false;
  recog.maxAlternatives = 1;

  recog.onresult = (e) => { $('q').value = e.results[0][0].transcript; askQuestion(); };
  recog.onerror = () => { listening = false; $('mic').classList.remove('on'); };
  recog.onend = () => { listening = false; $('mic').classList.remove('on'); };

  $('mic').onclick = () => {
    if (listening) { recog.stop(); return; }
    // Stop any answer still being read aloud, or it gets transcribed back.
    window.speechSynthesis?.cancel();
    try { recog.start(); listening = true; $('mic').classList.add('on'); } catch { /* already running */ }
  };
}

function speak(text) {
  if (!listening || !window.speechSynthesis || !text) return;   // only speak back to a spoken question
  const plain = String(text)
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')   // links read as their label, not the url
    .replace(/[*_`#>]/g, '')
    .replace(/\s+/g, ' ')
    .slice(0, 700);
  const u = new SpeechSynthesisUtterance(plain);
  u.lang = 'en-GB';
  u.rate = 1.05;
  window.speechSynthesis.speak(u);
}

(async () => {
  const s = await refresh(false);
  if (s?.running) startPolling();
})();
</script>
</body>
</html>
